[package]
name = "lsm-store"
version = "0.1.0"
edition = "2021"
description = "An LSM-tree storage engine, built in Rust stage by stage."
license = "MIT"
repository = "https://github.com/SrijanChallapalli/LSM-Storage-Engine"
readme = "README.md"
keywords = ["lsm", "storage-engine", "database", "key-value"]
categories = ["database-implementations"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "workload"
path = "src/bin/workload.rs"

[[bench]]
name = "memtable"
harness = false

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "sstable"
harness = false

[[bench]]
name = "compaction"
harness = false
